<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz | Dashboard</title>

    <script src="../js/sessao.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="../css/dashboards.css">
</head>

<body>

    <div class="header-left">
        <h1>Quiz</h1>
        <div class="hello"><h3>Olá, <span id="b_usuario">usuário</span>!</h3></div>
        <div class="btn-nav-white"><a href="../quiz.html"><h3>Fazer o quiz</h3></a></div>
        <div class="btn-nav"><h3>Meu desempenho</h3></div>
        <div class="btn-logout" onclick="limparSessao()"><h3>Sair</h3></div>
    </div>

    <div class="dash">
        <h2>Meu desempenho</h2>
        <p>Acompanhe seus acertos e erros a cada tentativa.</p>

        <div id="aviso" hidden></div>

        <div id="conteudo" hidden>
            <section class="kpis">
                <article class="kpi">
                    <span class="kpi-titulo">Aproveitamento</span>
                    <span class="kpi-sub">última tentativa · acertos sobre o total de questões</span>
                    <strong class="kpi-valor" id="kpiAproveitamento">0%</strong>
                    <div class="barra"><div id="barraAproveitamento"></div></div>
                    <span class="kpi-detalhe" id="detalheAproveitamento"></span>
                </article>

                <article class="kpi" id="cardMeta">
                    <span class="kpi-titulo">Meta de acertos</span>
                    <span class="kpi-sub" id="subMeta"></span>
                    <strong class="kpi-valor" id="kpiMeta">0 / 0</strong>
                    <div class="barra"><div id="barraMeta"></div></div>
                    <span class="kpi-detalhe" id="detalheMeta"></span>
                </article>

                <article class="kpi">
                    <span class="kpi-titulo">Tentativas</span>
                    <span class="kpi-sub">quizzes finalizados</span>
                    <strong class="kpi-valor" id="kpiTentativas">0</strong>
                    <span class="kpi-detalhe" id="detalheTentativas"></span>
                </article>
            </section>

            <section class="graficos" style="margin-top: 16px;">
                <div class="grafico">
                    <h3>Acertos x Erros</h3>
                    <div class="grafico-box"><canvas id="graficoRosca"></canvas></div>
                </div>
                <div class="grafico">
                    <h3>Evolução dos acertos</h3>
                    <div class="grafico-box"><canvas id="graficoLinha"></canvas></div>
                </div>
            </section>
        </div>
    </div>

<script>
    // Meta: percentual de acertos que você quer atingir em uma tentativa.
    // Para usar um número fixo, troque o cálculo de "meta" em montarDashboard().
    var META_PERCENTUAL = 80;

    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
    window.onload = carregarDashboard;

    function carregarDashboard() {
        var idUsuario = sessionStorage.ID_USUARIO;

        if (idUsuario == undefined) {
            window.location = "../login.html";
            return;
        }

        fetch(`/resultados/usuario/${idUsuario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resultados) {
                    montarDashboard(resultados);
                });
            } else {
                mostrarAviso("Não foi possível carregar seus resultados.");
            }
        }).catch(function (erro) {
            console.error(`Erro ao obter os dados: ${erro.message}`);
            mostrarAviso("Não foi possível carregar seus resultados.");
        });
    }

    function mostrarAviso(texto, comLink) {
        var aviso = document.getElementById("aviso");
        aviso.innerHTML = texto + (comLink ? ' <a href="../quiz.html">Fazer o quiz agora</a>' : "");
        aviso.hidden = false;
    }

    function montarDashboard(resultados) {
        if (resultados.length == 0) {
            mostrarAviso("Você ainda não fez o quiz.", true);
            return;
        }

        var totalAcertos = 0, totalErros = 0, melhor = resultados[0];

        resultados.forEach(function (r) {
            totalAcertos += Number(r.acertos);
            totalErros += Number(r.erros);
            if (r.acertos > melhor.acertos) melhor = r;
        });

        var totalQuestoes = totalAcertos + totalErros;
        var aproveitamento = totalQuestoes > 0 ? Math.round(totalAcertos / totalQuestoes * 100) : 0;
        var questoesMelhor = Number(melhor.acertos) + Number(melhor.erros);
        var meta = Math.ceil(questoesMelhor * META_PERCENTUAL / 100);
        var ultima = resultados[resultados.length - 1];

        // KPI 1 - aproveitamento da última tentativa, com as variáveis do quiz.html
        // (guardadas na sessão). Se não houver, usa a última tentativa do banco.
        var certas = sessionStorage.CERTAS != undefined ? Number(sessionStorage.CERTAS) : Number(ultima.acertos);
        var erradas = sessionStorage.ERRADAS != undefined ? Number(sessionStorage.ERRADAS) : Number(ultima.erros);
        var quantidadeDeQuestoes = sessionStorage.QTD_QUESTOES != undefined ? Number(sessionStorage.QTD_QUESTOES) : certas + erradas;
        var porcentagemUltima = quantidadeDeQuestoes > 0 ? Math.round(certas / quantidadeDeQuestoes * 100) : 0;

        kpiAproveitamento.innerHTML = porcentagemUltima + "%";
        barraAproveitamento.style.width = porcentagemUltima + "%";
        detalheAproveitamento.innerHTML = `${certas} acertos e ${erradas} erros em ${quantidadeDeQuestoes} questões`;

        // KPI 2 - meta
        var progresso = meta > 0 ? Math.min(100, Math.round(melhor.acertos / meta * 100)) : 0;
        subMeta.innerHTML = `melhor tentativa · meta de ${META_PERCENTUAL}% das questões`;
        kpiMeta.innerHTML = `${melhor.acertos} / ${meta}`;
        barraMeta.style.width = progresso + "%";

        if (melhor.acertos >= meta) {
            cardMeta.classList.add("atingida");
            detalheMeta.innerHTML = "Meta batida! 🎯";
        } else {
            detalheMeta.innerHTML = `Faltam ${meta - melhor.acertos} acertos para a meta`;
        }

        // KPI 3 - tentativas
        kpiTentativas.innerHTML = resultados.length;
        detalheTentativas.innerHTML = `Última: ${ultima.acertos} acertos e ${ultima.erros} erros`;

        conteudo.hidden = false;

        Chart.defaults.color = "#f3e9d8";
        Chart.defaults.font.family = '"Exo 2", sans-serif';

        plotarRosca(totalAcertos, totalErros, aproveitamento);
        plotarLinha(resultados, meta);
    }

    function plotarRosca(totalAcertos, totalErros, aproveitamento) {
        // escreve a porcentagem no centro da rosca
        var textoCentro = {
            id: "textoCentro",
            afterDraw: function (chart) {
                var ctx = chart.ctx, a = chart.chartArea;
                var x = (a.left + a.right) / 2, y = (a.top + a.bottom) / 2;
                ctx.save();
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#f3e9d8";
                ctx.font = '700 32px "Exo 2", sans-serif';
                ctx.fillText(aproveitamento + "%", x, y - 8);
                ctx.fillStyle = "#d9bd8a";
                ctx.font = '400 13px "Exo 2", sans-serif';
                ctx.fillText("geral", x, y + 18);
                ctx.restore();
            }
        };

        new Chart(document.getElementById("graficoRosca"), {
            type: "doughnut",
            data: {
                labels: [`Acertos (${totalAcertos})`, `Erros (${totalErros})`],
                datasets: [{
                    data: [totalAcertos, totalErros],
                    backgroundColor: ["#7fc99a", "#d96b5f"],
                    borderColor: "#2b2118",
                    borderWidth: 3
                }]
            },
            options: {
                maintainAspectRatio: false,
                cutout: "68%",
                plugins: { legend: { position: "bottom" } }
            },
            plugins: [textoCentro]
        });
    }

    function plotarLinha(resultados, meta) {
        var labels = resultados.map(function (r, i) { return `${i + 1}ª`; });
        var acertos = resultados.map(function (r) { return Number(r.acertos); });
        var maiorTotal = Math.max.apply(null, resultados.map(function (r) {
            return Number(r.acertos) + Number(r.erros);
        }));

        new Chart(document.getElementById("graficoLinha"), {
            type: "line",
            data: {
                labels: labels,
                datasets: [
                    {
                        label: "Acertos",
                        data: acertos,
                        borderColor: "#d9bd8a",
                        backgroundColor: "rgba(217, 189, 138, 0.2)",
                        fill: true,
                        tension: 0.3,
                        pointRadius: 5,
                        pointBackgroundColor: "#d9bd8a"
                    },
                    {
                        label: `Meta (${meta})`,
                        data: labels.map(function () { return meta; }),
                        borderColor: "#7fc99a",
                        borderDash: [6, 6],
                        pointRadius: 0,
                        fill: false
                    }
                ]
            },
            options: {
                maintainAspectRatio: false,
                scales: {
                    x: { title: { display: true, text: "Tentativas" }, grid: { color: "rgba(243, 233, 216, 0.1)" } },
                    y: {
                        beginAtZero: true,
                        suggestedMax: Math.max(meta, maiorTotal),
                        ticks: { precision: 0 },
                        title: { display: true, text: "Acertos" },
                        grid: { color: "rgba(243, 233, 216, 0.1)" }
                    }
                },
                plugins: { legend: { position: "bottom" } }
            }
        });
    }
</script>
</body>

</html>
