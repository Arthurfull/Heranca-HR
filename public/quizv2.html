<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo - Quiz</title>
    <link rel="stylesheet" href="./css/quiz.css">
</head>


<body onload="onloadEsconder()">

    <div id="pontuacaoEJogo">
        <button id="btnIniciarQuiz" onclick="iniciarQuiz()">INICIAR QUIZ</button>

        <div id="pontuacao" class="flex-colunar width-fit-content border-primary">
            <div id="pontuacaoDuranteJogo" class="flex-colunar padding-8">
                <span class="width-fit-content">Quantidade de acertos: <span id="spanCertas"></span></span>
                <span class="width-fit-content">Quantidade de erros: <span id="spanErradas"></span></span>
            </div>
            <div id="pontuacaoFinalJogo" class="flex-colunar padding-8">
                <span id="pontuacaoFinal" class="width-fit-content">Pontuação Final:
                    <span id="spanPontuacaoFinal">***</span>
                </span>
                <span id="msgFinal" class="width-fit-content">***</span>
            </div>
        </div>

        <div id="jogo" class="width-fit-content flex-colunar border-secondary">

            <div id="infoQuestao" class="padding-8">
                <span>Questão atual: <span id="spanNumeroDaQuestaoAtual"></span> de <span id="qtdQuestoes"></span>
                    questões.</span>
            </div>

            <div id="perguntaDaQuestaoAtual" class="padding-8">
                <span id="spanQuestaoExibida" class="text-bold"></span>
            </div>

            <div id="infoAlternativas" class="padding-8">
                <span><em>Escolha uma opção dentre as abaixo:</em></span>
            </div>

            <div id="opcoes" class="flex-colunar padding-8">
                <span>
                    <input type="radio" id="primeiraOpcao" name="option" class="radio" value="alternativaA" />
                    <label for="primeiraOpcao" class="option" id="labelOpcaoUm"></label>
                </span>
                <span>
                    <input type="radio" id="segundaOpcao" name="option" class="radio" value="alternativaB" />
                    <label for="segundaOpcao" class="option" id="labelOpcaoDois"></label>
                </span>
                <span>
                    <input type="radio" id="terceiraOpcao" name="option" class="radio" value="alternativaC" />
                    <label for="terceiraOpcao" class="option" id="labelOpcaoTres"></label>
                </span>
                <span>
                    <input type="radio" id="quartaOpcao" name="option" class="radio" value="alternativaD" />
                    <label for="quartaOpcao" class="option" id="labelOpcaoQuatro"></label>
                </span>
            </div>

            <div id="botoes" class="flex-colunar padding-8">
                <button onclick="submeter()" id="btnSubmeter">Submeter resposta</button>
                <button onclick="avancar()" id="btnProx" disabled>Avançar para próxima questão</button>
                <button onclick="tentarNovamente()" id="btnTentarNovamente" disabled>Tentar novamente</button>
            </div>

        </div>
    </div>

<script>
    const listaDeQuestoes = [

       {
            pergunta: "Qual é a principal atividade de um ourives na joalheria?",
            alternativaA: "Lapidar apenas pedras brutas extraídas de minas, sem trabalhar com metais.",
            alternativaB: "Projetar, moldar, soldar e dar acabamento a peças feitas de metais nobres (como ouro, prata e platina), muitas vezes cravando gemas.",
            alternativaC: "Avaliar o preço de mercado de relógios antigos e moedas raras em leilões.",
            alternativaD: "Extrair minérios do solo usando máquinas pesadas de escavação.",
            alternativaCorreta: "alternativaB"
        },
        {
            pergunta: "Quando você vê uma joia marcada como 18k ou 750, o que isso indica?",
            alternativaA: "Que a peça pesa exatamente 18 quilates.",
            alternativaB: "Que o ouro foi banhado 18 vezes para não descascar.",
            alternativaC: "Que a liga metálica tem 75% de ouro puro (18 de 24 partes) e 25% de outros metais para dar resistência.",
            alternativaD: "Que a joia foi fabricada no ano de 1975.",
            alternativaCorreta: "alternativaC"
        },
        {
            pergunta: "Muitas peças de ouro branco passam por um acabamento final chamado banho de ródio. Para que serve esse processo?",
            alternativaA: "Para transformar o ouro branco em prata de lei.",
            alternativaB: "Para dar uma camada protetora clara, brilhante e resistente a riscos superficiais.",
            alternativaC: "Para diminuir o peso da joia e torná-la mais barata.",
            alternativaD: "Para impedir que o metal derreta em altas temperaturas.",
            alternativaCorreta: "alternativaB"
        },
        {
            pergunta: "Ao dobrar, martelar ou laminar um fio de ouro ou prata, o metal fica duro e pode trincar. O que o recozimento faz?",
            alternativaA: "Congela a peça em nitrogênio líquido por uma hora.",
            alternativaB: "Aquece o metal até uma temperatura específica e o resfria para reorganizar sua estrutura interna e devolvê-lo ao estado maleável.",
            alternativaC: "Mergulha a peça em ácido sulfúrico até dissolver a camada externa.",
            alternativaD: "Lixa toda a superfície com uma lima grossa.",
            alternativaCorreta: "alternativaB"
        },
        {
            pergunta: "Por que a prata usada em joias costuma ser identificada como 925 (prata de lei)?",
            alternativaA: "Porque ela contém 92,5% de prata pura e 7,5% de outros metais, garantindo mais firmeza à peça.",
            alternativaB: "Porque ela só pode ser vendida a partir de 925 reais o grama.",
            alternativaC: "Porque ela foi fundida a 925 graus Celsius.",
            alternativaD: "Porque ela nunca escurece com o passar dos anos.",
            alternativaCorreta: "alternativaA"
        },
        {
            pergunta: "Quando uma joia leva um diamante, safira ou outra gema, o que é a cravação?",
            alternativaA: "O processo de colar a pedra com cola instantânea transparente.",
            alternativaB: "A técnica de prender a pedra com segurança usando o próprio metal da joia (garras, canaletas, caixa etc.), sem depender de cola.",
            alternativaC: "A medição do tamanho da pedra usando um paquímetro digital.",
            alternativaD: "A limpeza ultrassônica feita antes de entregar a joia ao cliente.",
            alternativaCorreta: "alternativaB"
        },
        {
            pergunta: "Na bancada do ourives, para que serve a serra de ourives (ou arco de serra)?",
            alternativaA: "Para derreter o metal em altas temperaturas antes de colocá-lo na forma.",
            alternativaB: "Para fazer cortes precisos e detalhados em chapas e fios de metal usando lâminas bem finas.",
            alternativaC: "Para medir o aro de um anel com precisão milimétrica.",
            alternativaD: "Para dar brilho espelhado usando pasta abrasiva.",
            alternativaCorreta: "alternativaB"
        },
        {
            pergunta: "O que é uma laminadora na ourivesaria?",
            alternativaA: "Uma máquina com rolos de aço que achata ou estica o metal para transformá-lo em chapas ou fios mais finos.",
            alternativaB: "Um forno elétrico usado para fundir grandes quantidades de ouro.",
            alternativaC: "Um instrumento usado apenas para testar se a pedra é verdadeira.",
            alternativaD: "Uma escova rotativa para limpar correntes finas.",
            alternativaCorreta: "alternativaA"
        },
        {
            pergunta: "Por que o ourives usa solda de ouro (com teor compatível ao da peça) em vez de solda comum de eletrônica?",
            alternativaA: "Porque a solda de eletrônica deixa a joia com cor verde-azulada.",
            alternativaB: "Porque a solda específica de joalheria mantém a cor, a pureza e a resistência da peça, fundindo-se em temperatura adequada sem derreter toda a joia.",
            alternativaC: "Porque a solda comum não gruda em nenhum tipo de metal.",
            alternativaD: "Porque a solda de ouro serve apenas para colar pedras preciosas.",
            alternativaCorreta: "alternativaB"
        },
        {
            pergunta: "O que é o polimento na etapa final de fabricação de uma joia?",
            alternativaA: "O processo de derreter a peça novamente para corrigir o tamanho.",
            alternativaB: "A remoção de riscos e marcas de ferramentas usando lixas finas, borrachas abrasivas e pastas de polir até alcançar o acabamento desejado.",
            alternativaC: "A gravação do nome do cliente por dentro da aliança com laser.",
            alternativaD: "A transformação de prata em ouro por meio de reação química.",
            alternativaCorreta: "alternativaB"
        },
        {
            pergunta: "O que significa dizer que uma joia é 'oca' ou 'maciça'?",
            alternativaA: "Maciça indica que a estrutura tem preenchimento interno contínuo de metal; oca indica que há espaço vazio por dentro para reduzir peso e custo.",
            alternativaB: "Maciça significa que a joia não tem nenhuma pedra; oca significa que ela tem pedras vazadas.",
            alternativaC: "Maciça é um termo usado apenas para colares; oca é usado apenas para brincos.",
            alternativaD: "Maciça indica que o metal é falso; oca indica que o metal é puro.",
            alternativaCorreta: "alternativaA"
        },
        {
            pergunta: "O que é a 'decapagem' (ou branqueamento) após soldar ou aquecer uma peça na ourivesaria?",
            alternativaA: "O banho em solução própria para remover óxidos e crostas escuras formadas pelo calor durante a solda ou recozimento.",
            alternativaB: "O ato de cortar a joia ao meio para verificar se há impurezas.",
            alternativaC: "A aplicação de verniz transparente para evitar oxidação futura.",
            alternativaD: "O ajuste do tamanho do anel usando um martelo de madeira.",
            alternativaCorreta: "alternativaA"
        },

    ]

    // variáveis globais    
    let RespostaEnviada = false
    let pontuacaoFinal = 0
    let numeroDaQuestaoAtual = 0
    let tentativaIncorreta = 0
    let certas = 0
    let erradas = 0
    let quantidadeDeQuestoes = listaDeQuestoes.length
    // let isUltima = numeroDaQuestaoAtual == quantidadeDeQuestoes-1 ? true : false

    function onloadEsconder() {
        document.getElementById('pontuacao').style.display = "none"
        document.getElementById('jogo').style.display = "none"
    }

    function iniciarQuiz() {
        document.getElementById('pontuacao').style.display = "flex"
        document.getElementById('jogo').style.display = "flex"
        document.getElementById('btnIniciarQuiz').style.display = "none"

        document.getElementById('qtdQuestoes').innerHTML = quantidadeDeQuestoes

        preencherHTMLcomQuestaoAtual(0)

        btnSubmeter.disabled = false
        btnProx.disabled = true
        // btnConcluir.disabled = true
        btnTentarNovamente.disabled = true
    }

    function preencherHTMLcomQuestaoAtual(index) {
        habilitarAlternativas(true)
        const questaoAtual = listaDeQuestoes[index]
        numeroDaQuestaoAtual = index        
        console.log("questaoAtual")
        console.log(questaoAtual)
        document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = Number(index) + 1 // ajustando porque o index começa em 0
        document.getElementById("spanQuestaoExibida").innerHTML = questaoAtual.pergunta;
        document.getElementById("labelOpcaoUm").innerHTML = questaoAtual.alternativaA;
        document.getElementById("labelOpcaoDois").innerHTML = questaoAtual.alternativaB;
        document.getElementById("labelOpcaoTres").innerHTML = questaoAtual.alternativaC;
        document.getElementById("labelOpcaoQuatro").innerHTML = questaoAtual.alternativaD;
    }

    function submeter() {
        const options = document.getElementsByName("option"); // recupera alternativas no html

        let hasChecked = false
        for (let i = 0; i < options.length; i++) {
            if (options[i].checked) {
                hasChecked = true
                break
            }
        }

        if (!hasChecked) {
            alert("Não há alternativas escolhidas. Escolha uma opção.")
        } else {
            btnSubmeter.disabled = true
            btnProx.disabled = false

            habilitarAlternativas(false)

            checarResposta()
        }
    }

    function habilitarAlternativas(trueOrFalse) {
        let opcaoEscolhida = trueOrFalse ? false : true

        primeiraOpcao.disabled = opcaoEscolhida
        segundaOpcao.disabled = opcaoEscolhida
        terceiraOpcao.disabled = opcaoEscolhida
        quartaOpcao.disabled = opcaoEscolhida

    }

    function avancar() {
        btnProx.disabled = true
        btnSubmeter.disabled = false

        desmarcarRadioButtons()

        if (numeroDaQuestaoAtual < quantidadeDeQuestoes - 1) {
            preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
        } else if (numeroDaQuestaoAtual == quantidadeDeQuestoes - 1) {
            alert("Atenção... a próxima é a ultima questão!")
            preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
        } else {
            finalizarJogo()
        }
        limparCoresBackgroundOpcoes()
    }

    function tentarNovamente() {
        // atualiza a página
        window.location.reload()
    }

    function checarResposta() {
        const questaoAtual = listaDeQuestoes[numeroDaQuestaoAtual] // questão atual 
        const respostaQuestaoAtual = questaoAtual.alternativaCorreta // qual é a resposta correta da questão atual

        const options = document.getElementsByName("option"); // recupera alternativas no html

        let alternativaCorreta = null // variável para armazenar a alternativa correta

        options.forEach((option) => {
            if (option.value === respostaQuestaoAtual) {
                console.log("alternativaCorreta está no componente: " + alternativaCorreta)
                alternativaCorreta = option.labels[0].id
            }
        })

        // verifica se resposta assinalada é correta
        options.forEach((option) => {
            if (option.checked === true && option.value === respostaQuestaoAtual) {
                document.getElementById(alternativaCorreta).classList.add("text-success-with-bg")
                pontuacaoFinal++
                certas++
                document.getElementById("spanCertas").innerHTML = certas
                numeroDaQuestaoAtual++
            } else if (option.checked && option.value !== respostaQuestaoAtual) {
                const wrongLabelId = option.labels[0].id

                document.getElementById(wrongLabelId).classList.add("text-danger-with-bg")
                document.getElementById(alternativaCorreta).classList.add("text-success-with-bg")
                tentativaIncorreta++
                erradas++
                document.getElementById("spanErradas").innerHTML = erradas
                numeroDaQuestaoAtual++
            }
        })
    }

    function limparCoresBackgroundOpcoes() {
        const options = document.getElementsByName("option");
        options.forEach((option) => {
            document.getElementById(option.labels[0].id).classList.remove("text-danger-with-bg")
            document.getElementById(option.labels[0].id).classList.remove("text-success-with-bg")
        })
    }

    function desmarcarRadioButtons() {
        const options = document.getElementsByName("option");
        for (let i = 0; i < options.length; i++) {
            options[i].checked = false;
        }
    }

    function finalizarJogo() {
        let textoParaMensagemFinal = null
        let classComCoresParaMensagemFinal = null
        const porcentagemFinalDeAcertos = pontuacaoFinal / quantidadeDeQuestoes

        if (porcentagemFinalDeAcertos <= 0.3) {
            textoParaMensagemFinal = "Parece que você não estudou..."
            classComCoresParaMensagemFinal = "text-danger-with-bg"
        }
        else if (porcentagemFinalDeAcertos > 0.3 && porcentagemFinalDeAcertos < 0.9) {
            textoParaMensagemFinal = "Pode melhorar na próxima, hein!"
            classComCoresParaMensagemFinal = "text-warning-with-bg"
        }
        else if (porcentagemFinalDeAcertos >= 0.9) {
            textoParaMensagemFinal = "Uau, parabéns!"
            classComCoresParaMensagemFinal = "text-success-with-bg"
        }

        textoParaMensagemFinal += "<br> Você acertou " + Math.round((porcentagemFinalDeAcertos)*100) + "% das questões."


        document.getElementById('msgFinal').innerHTML = textoParaMensagemFinal
        document.getElementById('msgFinal').classList.add(classComCoresParaMensagemFinal) 
        document.getElementById('spanPontuacaoFinal').innerHTML = pontuacaoFinal

        document.getElementById('jogo').classList.add("text-new-gray") 

        btnProx.disabled = true
        btnSubmeter.disabled = true
        // btnConcluir.disabled = true
        btnTentarNovamente.disabled = false
        
        sessionStorage.CERTAS = certas
        sessionStorage.ERRADAS = erradas
        sessionStorage.QTD_QUESTOES = quantidadeDeQuestoes

        // envia o resultado para o backend (que grava no banco)
        fetch("/resultados", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                acertos: certas,
                erros: erradas,
                fkUsuario: Number(sessionStorage.ID_USUARIO)
            })
        })
        .then(resposta => resposta.json())
        .then(dados => console.log("Resultado salvo:", dados))
        .catch(erro => console.error("Erro ao salvar resultado:", erro))
        .finally(() => {
            // espera 2s para a pessoa ver a mensagem final e vai para a dashboard
            setTimeout(() => { window.location = "./dashboard/dashboard.html" }, 2000)
        })


    }
</script>
</body>

</html>
